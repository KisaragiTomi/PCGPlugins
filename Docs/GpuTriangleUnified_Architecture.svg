<svg viewBox="0 0 980 720" width="980" height="720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <pattern id="descriptor-grid" patternUnits="userSpaceOnUse" width="9.3334" height="9.3334">
      <rect width="9.3334" height="9.3334" fill="#dcfce7"/>
      <path d="M4.6667 0H0V4.6667" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
      <path d="M0 4.6667L4.6667 0" stroke="#16a34a" stroke-width="0.3333" opacity="0.257576"/>
    </pattern>
    <pattern id="readback-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#ede9fe"/>
      <circle cx="3" cy="3" r="1.25" fill="#7c3aed" opacity="0.291429"/>
      <circle cx="9" cy="9" r="1.25" fill="#7c3aed" opacity="0.291429"/>
    </pattern>
    <pattern id="retained-stripe-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="legacy-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .lane { font-size: 12px; font-weight: 700; fill: #475569; }
    .n { stroke: #64748b; stroke-width: 1; rx: 8; }
    .plain { fill: #f8fafc; }
    .descriptor-grid { fill: url(#descriptor-grid); }
    .readback-dot { fill: url(#readback-dot-bg); }
    .retained-stripe { fill: url(#retained-stripe-bg); }
    .legacy-hatch { fill: url(#legacy-hatch); }
    .h { font-size: 11.5px; font-weight: 700; fill: #0f172a; }
    .t { font-size: 10.5px; fill: #334155; }
    .s { font-size: 9.5px; fill: #64748b; }
    .edge { stroke: #475569; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    .badge { fill: #1e293b; rx: 4; }
    .badge-t { font-size: 9.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <text x="20" y="30" class="title">GPU 三角形统一架构：三种储存形态 → 双层 readback → 双 sink</text>

  <!-- lane labels -->
  <text x="20" y="66" class="lane">生产者 (compute)</text>
  <text x="250" y="66" class="lane">GPU 储存形态 (三种)</text>
  <text x="530" y="66" class="lane">统一 readback 层</text>
  <text x="770" y="66" class="lane">CPU 侧 / sink</text>

  <!-- producers -->
  <rect x="20" y="84" width="190" height="56" class="n plain"/>
  <text x="30" y="102" class="h">AComputeShaderMeshGenerator</text>
  <text x="30" y="117" class="t">box-scene 三角汤 CS</text>
  <text x="30" y="131" class="t">表面体素化 CS</text>

  <rect x="20" y="168" width="190" height="44" class="n plain"/>
  <text x="30" y="186" class="h">RoadBuilder.usf</text>
  <text x="30" y="201" class="t">indexed 路网 (V != I)</text>

  <rect x="20" y="240" width="190" height="44" class="n plain"/>
  <text x="30" y="258" class="h">CSDirectMesh.usf</text>
  <text x="30" y="273" class="t">世界空间三角汤 (V == I)</text>

  <rect x="20" y="312" width="190" height="56" class="n plain"/>
  <text x="30" y="330" class="h">AddVineMeshPasses</text>
  <text x="30" y="345" class="t">VVVoxel.usf</text>
  <text x="30" y="359" class="t">VINE_OUTPUT_BASESTREAMS</text>

  <!-- storage forms -->
  <rect x="250" y="80" width="230" height="66" class="n plain"/>
  <text x="260" y="98" class="h">(b) 瞬态过程 buffer</text>
  <text x="260" y="113" class="t">单个 FRDGBuilder 图内创建即消费</text>
  <text x="260" y="127" class="t">汤 / 体素 / landscape 三角</text>
  <text x="260" y="140" class="s">回读必须在图内 AddCopies</text>

  <rect x="250" y="176" width="230" height="72" class="n retained-stripe"/>
  <text x="260" y="194" class="h">(c) actor 持有 retained pooled</text>
  <text x="260" y="209" class="t">FCSSurfaceVoxelGPUBuffers</text>
  <text x="260" y="223" class="t">跨帧存活, 供 vine 投影直接注册</text>
  <text x="260" y="237" class="s">未来: 三角汤 GPU 镜像同型</text>

  <rect x="250" y="286" width="230" height="112" class="n descriptor-grid"/>
  <text x="260" y="304" class="h">(a) proxy 描述符流 (核心)</text>
  <text x="260" y="320" class="t">FCSGpuStreamDesc × 7 标准流</text>
  <text x="260" y="334" class="t">Position / Tangent / UV / Color</text>
  <text x="260" y="348" class="t">Index / IndirectArgs / MeshCounters</text>
  <text x="260" y="363" class="t">拓展 = 叶子 RegisterStreams()</text>
  <text x="260" y="377" class="t">里多一次 AddStream(...)</text>
  <text x="260" y="391" class="s">road / direct / vine 三个叶子共用</text>

  <rect x="250" y="430" width="230" height="46" class="n plain"/>
  <text x="260" y="448" class="h">FLocalVertexFactory + 间接绘制</text>
  <text x="260" y="463" class="t">DrawIndexedIndirect, 无回读渲染</text>

  <!-- readback layers -->
  <rect x="530" y="96" width="196" height="118" class="n readback-dot"/>
  <text x="540" y="114" class="h">L0 FCSGpuReadbackBatch (P0)</text>
  <text x="540" y="130" class="t">RT 半侧: AddCopies(GraphBuilder&amp;)</text>
  <text x="540" y="144" class="t">GT 半侧: Resolve = flush + lock</text>
  <text x="540" y="158" class="t">模式 1: capacity 整拷 (单段)</text>
  <text x="540" y="172" class="t">模式 2: counted 两段 (仅 pooled)</text>
  <text x="540" y="186" class="t">请求携带 per-buffer FinalAccess</text>
  <text x="540" y="200" class="s">RAII 持有 FRHIGPUBufferReadback</text>

  <rect x="530" y="260" width="196" height="82" class="n readback-dot"/>
  <text x="540" y="278" class="h">L1 ReadbackMeshSync</text>
  <text x="540" y="294" class="t">重建于 L0, flush 5 → 3</text>
  <text x="540" y="308" class="t">(proxy 重建栅栏必须保留)</text>
  <text x="540" y="322" class="t">按 CpuSemantic 解包, 契约不变</text>
  <text x="540" y="336" class="s">尺寸/过滤收敛为单一权威</text>

  <!-- CPU side -->
  <rect x="770" y="84" width="192" height="84" class="n plain"/>
  <text x="780" y="102" class="h">BP 边界类型 (保留)</text>
  <text x="780" y="118" class="t">FCSTriangleMeshData</text>
  <text x="780" y="132" class="t">FCSSurfaceVoxelData</text>
  <text x="780" y="146" class="t">BlueprintType, 字段不动</text>
  <text x="780" y="160" class="s">只做单向适配, 不并入快照</text>

  <rect x="770" y="252" width="192" height="50" class="n plain"/>
  <text x="780" y="270" class="h">FCSGpuMeshCPUData</text>
  <text x="780" y="286" class="t">叶子统一 CPU 快照 (非反射)</text>

  <rect x="770" y="330" width="192" height="54" class="n plain"/>
  <text x="780" y="348" class="h">sink A: CSGpuMeshSave</text>
  <text x="780" y="363" class="t">→ StaticMesh 资产</text>
  <text x="780" y="377" class="s">默认 level result/ + dirty</text>

  <rect x="770" y="410" width="192" height="54" class="n plain"/>
  <text x="780" y="428" class="h">sink B (P1 新增)</text>
  <text x="780" y="443" class="t">BuildDynamicMeshFromGpuMeshData</text>
  <text x="780" y="457" class="t">→ UDynamicMesh</text>

  <!-- edges: producers -> storage -->
  <path class="edge" d="M210 104 H250"/>
  <path class="edge" d="M210 128 C232 128 232 200 250 200"/>
  <path class="edge" d="M210 190 C236 190 236 320 250 320"/>
  <path class="edge" d="M210 262 C236 262 236 340 250 340"/>
  <path class="edge" d="M210 340 C236 340 236 360 250 360"/>

  <!-- edges: storage -> readback / draw -->
  <path class="edge" d="M480 113 H530"/>
  <path class="edge" d="M480 212 C508 212 508 170 530 170"/>
  <path class="edge" d="M480 300 H530"/>
  <path class="edge" d="M365 398 V430"/>

  <!-- edges: readback -> CPU -->
  <path class="edge" d="M726 126 H770"/>
  <path class="edge" d="M726 300 C750 300 750 277 770 277"/>
  <path class="edge" d="M866 302 V330"/>
  <path class="edge" d="M902 384 C910 396 910 398 902 410"/>

  <!-- phase badges -->
  <rect x="492" y="96" width="26" height="16" class="badge"/>
  <text x="497" y="108" class="badge-t">P1</text>
  <rect x="492" y="176" width="26" height="16" class="badge"/>
  <text x="497" y="188" class="badge-t">P1</text>
  <rect x="492" y="282" width="26" height="16" class="badge"/>
  <text x="497" y="294" class="badge-t">P0</text>
  <rect x="732" y="104" width="32" height="16" class="badge"/>
  <text x="736" y="116" class="badge-t">适配</text>

  <!-- legacy lane -->
  <rect x="20" y="520" width="706" height="84" class="n legacy-hatch"/>
  <text x="30" y="540" class="h">vine 旧输出尾巴 — 冻结到 M2 验收作对照基准, M3 整体删除 (不迁 L0, 不迁 sink)</text>
  <text x="30" y="558" class="t">VVVoxel_*Readback → BuildDynamicMeshFromGPUVineOutput → RecomputeVineOutputUVs → AppendMesh</text>
  <text x="30" y="574" class="t">M3 需单独处置: SurfaceTargets 统计 / StageCenter 调试画线 / SaveStaticmesh 的 actor 生命周期包装</text>
  <text x="30" y="590" class="s">删除前置条件: M1 目视验证 + M2 GPU V-scan + 叶子-旧路 parity 自动化测试全绿</text>
  <rect x="672" y="528" width="44" height="16" class="badge"/>
  <text x="677" y="540" class="badge-t">P2·M3</text>

  <!-- legend -->
  <rect x="740" y="520" width="222" height="150" class="n plain"/>
  <text x="750" y="538" class="h">图例</text>
  <rect x="750" y="548" width="26" height="16" class="n descriptor-grid"/>
  <text x="784" y="560" class="t">描述符驱动储存 (核心)</text>
  <rect x="750" y="572" width="26" height="16" class="n readback-dot"/>
  <text x="784" y="584" class="t">统一 readback 层</text>
  <rect x="750" y="596" width="26" height="16" class="n retained-stripe"/>
  <text x="784" y="608" class="t">actor 持有 retained pooled</text>
  <rect x="750" y="620" width="26" height="16" class="n legacy-hatch"/>
  <text x="784" y="632" class="t">遗留路径 (M3 删除)</text>
  <text x="750" y="656" class="s">P0/P1/P2 = 迁移阶段标记</text>
</svg>
