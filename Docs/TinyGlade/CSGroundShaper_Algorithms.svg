  <circle cx="762.0" cy="342.9" r="2.6" fill="#0f172a"/>
  <text x="716" y="268" class="s">ray 投影</text>
  <text x="642" y="304" class="s">横杠 = 一层的一圈点</text>
  <text x="642" y="318" class="s">（剖面里看就是一段）</text>
  <text x="742" y="384" class="s" text-anchor="middle">N 层 × M 点 次投影</text>

  <text x="896" y="122" class="ue">UE：GPU 上逐格 marching squares</text>
  <text x="896" y="140" class="t">Level = L · StairStepHeight，等距</text>
  <text x="896" y="156" class="t">格角高度：解析场直接求值，不采图</text>
  <text x="896" y="172" class="t">跨层的格边：线性插值 → 2 次割线</text>
  <text x="896" y="206" class="s">剖面上看：一条格边 = 两个相邻格角（黑点），</text>
  <text x="896" y="220" class="s">两角分居某层两侧，才在这条边上解穿越点</text>

