  <text x="56" y="554" class="s">过阈格里的等值线段 = 一级石阶</text>
  <line x1="32" y1="566" x2="48" y2="566" class="segx"/>
  <text x="56" y="569" class="s">未过阈的格：早退，不解等值线（灰线只示意位置）</text>

