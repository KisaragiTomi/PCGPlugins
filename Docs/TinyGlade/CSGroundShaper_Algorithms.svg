    .brace    { stroke: #475569; stroke-width: 1; fill: none; }
    .cap      { stroke: #0e7490; stroke-width: 3.2; fill: none; stroke-linecap: round; }
    .lip      { stroke: #b45309; stroke-width: 3.6; fill: none; stroke-linecap: round; }
    .ghost    { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 4 3; }
    .terrain  { stroke: #334155; stroke-width: 2; fill: none; }
  </style>

  <text x="20" y="30" class="title">UE 端怎么替掉 Houdini 的解法：四处算法替换</text>
  <text x="20" y="52" class="sub">橙色 = Houdini 原型的求解方式；青色 = UE 的做法。四处都已落地（按 2026-09-18 代码）；②③ 的旧 CPU 路 2026-08-30 已删，只在面板底部留一行历史。</text>

  <!-- ============================== ① 高度剖面 ============================== -->
  <rect x="20" y="70" width="560" height="390" class="panel"/>
  <rect x="20" y="70" width="560" height="26" class="phead"/>
  <text x="32" y="88" class="ptext">① 高度剖面：台顶为什么是平的</text>

  <text x="62" y="122" class="hou">Houdini：xyzdist 到 DeformSource 多边形"面"，面内距离 = 0 ⇒ chramp(0) = 1</text>
  <text x="62" y="138" class="ue">UE：Skirt = max(0, d − Radius)，盘内 Skirt = 0 ⇒ 同样恒为 Top</text>

  <line x1="62" y1="392" x2="556" y2="392" class="axis"/>
  <line x1="62" y1="392" x2="62" y2="168" class="axis"/>
  <text x="558" y="396" class="s">r</text>
  <text x="54" y="166" class="s">h</text>

  <line x1="200" y1="185" x2="200" y2="392" class="guide"/>
  <line x1="420" y1="240" x2="420" y2="392" class="guide"/>
  <text x="200" y="408" class="s" text-anchor="middle">Radius</text>
  <text x="420" y="408" class="s" text-anchor="middle">Radius + Falloff</text>
  <text x="56" y="182" class="s" text-anchor="end">Top</text>

  <path d="M62,185 L200,185 C268,185 352,390 420,390 L548,390" class="curve"/>
  <polyline points="231,203 240,216 250,219 259,236 268,238 277,256 287,258 296,281 306,283 315,304 325,306 334,329 344,331 353,352 363,354 372,371 382,373 391,384 401,386 410,391" class="noise"/>

  <rect x="300" y="200" width="248" height="62" class="box plain"/>
  <text x="310" y="218" class="h">UE：h = Top · (S + 0.021·S^1.5)</text>
  <text x="310" y="234" class="t">S = W²(3 − 2W)，W = 1 − Skirt / Falloff</text>
  <text x="310" y="252" class="hou">原型：chramp("lerp", Skirt/Falloff)，B 样条</text>

  <text x="32" y="434" class="t">同一条解析场，GPU 侧被地面位移 / 石阶 / 岩壳 / 地被四个 pass 直接求值，CPU 孪生供落座 / 拾取。</text>
  <text x="32" y="450" class="s">红虚线 = 裙边噪声 S −= |turb·(1−S)|·Amount（默认 0.5，加在 max 之前）；等高线因此不再是圆，② 照扫不误。</text>

  <!-- ============================== ② 等高线 ============================== -->
  <rect x="600" y="70" width="560" height="390" class="panel"/>
  <rect x="600" y="70" width="560" height="26" class="phead"/>
  <text x="612" y="88" class="ptext">② 等高线：从「线性锥 + ray 投影」换成逐格 marching squares</text>

  <line x1="878" y1="104" x2="878" y2="400" class="axis"/>

  <text x="614" y="122" class="hou">Houdini：线性锥近似 + ray 投影</text>
  <text x="614" y="138" class="s">每层套一圈点，逐点最近距离投到坡面</text>
  <text x="614" y="154" class="s">line1 → resample1 → copytopoints2 → ray1</text>

