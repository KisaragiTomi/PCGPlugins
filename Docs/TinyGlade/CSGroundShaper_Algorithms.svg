  <path d="M745,569 L759,569" class="brace"/>
  <text x="766" y="573" class="s">LipOffset（TG 实测 21.4 cm）</text>
  <text x="1140" y="573" class="s" text-anchor="end">青 = 盖（is_top=1）　橙 = 裙（is_top=0，每一个都跨两圈）</text>

  <line x1="700" y1="583" x2="700" y2="599" class="edge"/>
  <text x="712" y="596" class="ue">披挂：每个顶点用自己的 XY 取地面高度（Y 是替换，不是位移）</text>

  <path d="M630,745 L760,745 C820,745 880,635 940,635 L1140,635" class="terrain"/>
  <text x="640" y="762" class="s">地面高度场</text>

  <path d="M636,740 L696,740" class="ghost"/>
  <path d="M1006,630 L1066,630" class="ghost"/>
  <path d="M1080,630 L1140,630" class="ghost"/>
  <text x="672" y="690" class="s" text-anchor="middle">平地：坡度≈0，裙边塌成 0</text>
  <text x="672" y="703" class="s" text-anchor="middle">且 mask 把它写成 NaN</text>
  <line x1="672" y1="710" x2="668" y2="732" class="axis" marker-end="url(#arrow)"/>
  <text x="1073" y="656" class="s" text-anchor="middle">台顶同理，整批 NaN</text>

  <path d="M710,740 L770,736.2" class="cap"/>
  <path d="M784,730.9 L844,690.1" class="cap"/>
  <path d="M858,678.2 L918,638.3" class="cap"/>
  <path d="M932,633 L992,630" class="cap"/>
  <path d="M696,740 L710,740" class="lip"/>
  <path d="M770,736.2 L784,730.9" class="lip"/>
