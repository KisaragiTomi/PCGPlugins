  <text x="300" y="524" class="ue">每格独立判定，CPU 不知道有几级：</text>
  <text x="300" y="544" class="ue">① 格心路权 ≥ StairRoadThreshold（0.35）</text>
  <text x="300" y="558" class="t">　 读 GPU 色流；替掉原型 blast8 的 @road&gt;0</text>
  <text x="300" y="576" class="ue">② 峰高 &lt; StairMinMoundHeight（60）的包不出</text>
  <text x="300" y="590" class="t">　 矮包抬脚就上去（2026-09-06 裁决）</text>
  <text x="300" y="608" class="ue">③ bStairDropTopStep：掐掉台顶那一级</text>
  <text x="300" y="622" class="t">　 同日裁决：顶圈只是个绊脚的沿</text>
  <text x="300" y="640" class="ue">④ 格内每条等值线段 = 一级石阶</text>
  <text x="300" y="654" class="t">　 块心 = 弦中点再沿坡向上推 StairEmbed</text>
  <text x="300" y="668" class="t">　 踏面恒水平，+X 指向下坡</text>
  <text x="300" y="686" class="ue">⑤ 长度跟弦长走：max(弦长, 名义)×1.06</text>
  <text x="300" y="700" class="t">　 ×(1 + 单侧抖动)；定长块在斜走处露缝</text>
  <text x="300" y="718" class="ue">⑥ 抖动种子 = 格身份（格坐标 + 层 + 段）</text>
  <text x="300" y="732" class="t">　 不用 InterlockedAdd 的槽位，重扫不乱跳</text>
  <text x="300" y="750" class="ue">⑦ 15% 概率在弦上撒一颗石子</text>
  <text x="300" y="764" class="t">　 另一张网格 ⇒ 另一套实例源</text>
  <text x="300" y="786" class="s">单格细节见 CSGroundStairs_Logic.svg</text>
  <circle cx="304" cy="803" r="2.6" class="ctrok"/>
  <text x="312" y="806" class="s">格心路权过阈</text>
  <circle cx="380" cy="803" r="1.9" class="ctrno"/>
  <text x="388" y="806" class="s">未过阈</text>
  <circle cx="434" cy="803" r="2.8" class="pebble"/>
  <text x="442" y="806" class="s">石子（15%）</text>

  <text x="32" y="836" class="hou">原型：copytopoints1 把单一 Step 盒沿环每 0.278 等距摆放（resample2）。</text>
  <text x="32" y="851" class="t">UE：同样是单一网格 StairMesh + 逐实例哈希抖动（同 TG），间距 = 格距 StairCellSize ≈ 石阶长。</text>
  <text x="32" y="865" class="s">历史：旧路「弧段 → B 样条控制点 → SolveBlockLayout 变长铺装」2026-08-30 裁决一删除，用户接受观感变化。</text>

  <!-- ============================== ④ 碎石：披挂岩壳 ============================== -->
  <rect x="600" y="480" width="560" height="390" class="panel"/>
  <rect x="600" y="480" width="560" height="26" class="phead"/>
  <text x="612" y="498" class="ptext">④ 碎石：TG 式披挂岩壳（已落地 · CSGroundRockShell.usf）</text>

  <text x="614" y="522" class="hou">原型：cook 时 Voronoi 切片 → 挤出 → 减面（旧链 B）；UE 整条不移植</text>
  <text x="614" y="538" class="ue">UE：TG 原件的平面碎裂图案（离线）+ 运行时一线程一三角披挂</text>

  <text x="1140" y="555" class="s" text-anchor="end">青 = 盖（is_top=1）　橙 = 裙（is_top=0，每一个都跨两圈）</text>
