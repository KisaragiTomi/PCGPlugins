  <text x="884" y="706" class="hou">裙边高度 ≈ 局部坡度 × 两圈水平错开 + 沿法线厚度差</text>
  <text x="884" y="719" class="s">错开 = LipOffset + SkirtTilt（只推底圈）</text>
  <text x="884" y="732" class="s">前一项零行代码；厚度 = CellRelief × Rock</text>

  <text x="614" y="778" class="t">显隐只看坡度：mask = smoothstep(0.75, 1.25, |∇h|)；三顶点任一 |∇h| &gt; 0.75 就保留整个三角，</text>
  <text x="614" y="794" class="t">否则只写第 0 个顶点的 x = NaN（省 8/9 写入）。抬高地形 → 新一圈陡坡 → 一整批胞腔亮起来。</text>
  <text x="614" y="810" class="t">路不参与显隐：saturate(R × 10) 先做可分离高斯（RockShellRoadBlurRadius 300 cm），壳按它连续下沉。</text>
  <text x="614" y="826" class="t">体积：Z 基准 lerp(−BaseSink, +BaseLift, saturate(Rock − Road)) + 沿法线厚度 CellRelief + ∝ 坡度的起伏。</text>
  <rect x="614" y="834" width="534" height="28" class="box missing"/>
  <text x="626" y="852" class="h">无运行时 Voronoi / 无挤出 / 无减面 / 无 counter / 无 indirect / 无回读 —— buffer 定长，永不变。</text>
