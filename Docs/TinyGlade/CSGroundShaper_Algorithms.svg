  <text x="884" y="706" class="hou">裙边高度 = 局部坡度 × LipOffset</text>
  <text x="884" y="719" class="s">陡处自动拉开、缓处自动收拢 —— 零行代码</text>

  <text x="614" y="790" class="t">静止姿态只提供平面上的碎裂图案；顶点 Y 在运行时被地面高度整个替换（TG：`_357.y = _356`，赋值不是 +=）。</text>
  <text x="614" y="806" class="t">显隐由坡度 mask 驱动：抬高地形 → 出现新一圈陡坡 → 一整批原本 NaN 的胞腔亮起来。看着"形状大变"，</text>
  <text x="614" y="822" class="t">其实是换了一批胞腔在演。三个顶点任一过阈即保留整个三角；都不过则只往第 0 个顶点写 NaN（省 2/3 写入）。</text>
