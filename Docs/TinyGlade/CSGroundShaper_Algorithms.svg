  <text x="1025" y="378" class="s" text-anchor="middle"><tspan fill="#0e7490">○</tspan> 线性插值　<tspan fill="#0e7490">●</tspan> 2 次割线精化后</text>
  <text x="1025" y="392" class="s" text-anchor="middle">曲率大的脚 / 肩处差得最多，格 100 cm 时可达十几 cm</text>

  <text x="612" y="428" class="t">扫的是全部塑形物取 max 后的合成场：等高线不必是圆，两座相接处只是普通的一格。</text>
  <text x="612" y="446" class="s">历史：旧路 BuildStepPlan 的闭式环半径 W = 0.5 − sin(asin(1−2y)/3) 只对孤立的圆成立，2026-08-30 裁决一删除。</text>

  <!-- ============================== ③ 俯视：一格一段 ============================== -->
  <rect x="20" y="480" width="560" height="390" class="panel"/>
  <rect x="20" y="480" width="560" height="26" class="phead"/>
  <text x="32" y="498" class="ptext">③ 俯视：格心路权门控 → 一格一段 → 一级石阶</text>

  <rect x="32" y="516" width="16" height="9" class="road"/>
  <text x="56" y="524" class="s">路：道路权重 ≥ StairRoadThreshold 的带</text>
