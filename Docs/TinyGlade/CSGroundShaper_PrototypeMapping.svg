<svg viewBox="0 0 1180 868" width="1180" height="868" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <pattern id="live-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="legacy-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
    <pattern id="gpu-stripe-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .title    { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub      { font-size: 11.5px; fill: #475569; }
    .bandhead { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; rx: 5; }
    .bandtext { font-size: 12px; font-weight: 700; fill: #0f172a; }
    .bandnote { font-size: 10.5px; fill: #475569; }
    .n        { stroke: #64748b; stroke-width: 1; rx: 6; }
    .plain    { fill: #f8fafc; }
    .live-dot { fill: url(#live-dot-bg); }
    .legacy   { fill: url(#legacy-hatch); }
    .gpu      { fill: url(#gpu-stripe-bg); }
    .h        { font-size: 10.5px; font-weight: 700; fill: #0f172a; }
    .t        { font-size: 9.5px;  fill: #334155; }
    .s        { font-size: 9.5px;  fill: #64748b; }
    .edge     { stroke: #475569; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    .wrap     { stroke: #94a3b8; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    .badge    { fill: #1e293b; rx: 4; }
    .badge-t  { font-size: 9.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <text x="30" y="30" class="title">TinyGlade.hip /obj/geo1 → UE：三条链的对照（塑形物只出高度场，石阶与岩壳归地面）</text>
  <text x="30" y="50" class="sub">灰底 = Houdini 原型节点（左→右为 cook 顺序）；青点底 = UE 已落地；琥珀条纹 = GPU pass；斜纹底 = 已删除的旧路（留档）。按 2026-09-18 代码核对。</text>

  <rect x="30" y="70" width="1120" height="26" class="bandhead"/>
  <text x="42" y="88" class="bandtext">链 A　高度场与地面隆起</text>
  <text x="240" y="88" class="bandnote">road 顶点属性在这里被刷上，后面两条链都靠它分流</text>

  <g>
    <rect x="40"  y="106" width="132" height="38" class="n plain"/>
    <text x="48"  y="121" class="h">grid1</text>
    <text x="48"  y="135" class="t">10×10 单位，50×50</text>
    <line x1="172" y1="125" x2="192" y2="125" class="edge"/>

    <rect x="196" y="106" width="132" height="38" class="n plain"/>
    <text x="204" y="121" class="h">attribpaint1</text>
    <text x="204" y="135" class="t">刷 f@road</text>
    <line x1="328" y1="125" x2="348" y2="125" class="edge"/>

    <rect x="352" y="106" width="132" height="38" class="n plain"/>
    <text x="360" y="121" class="h">deformbyinfluence1</text>
    <text x="360" y="135" class="t">dist = ramp(d / 0.67)</text>
    <line x1="484" y1="125" x2="504" y2="125" class="edge"/>

    <rect x="508" y="106" width="132" height="38" class="n plain"/>
    <text x="516" y="121" class="h">noisebysourcestress1</text>
    <text x="516" y="135" class="t">dist −= |turb·(1−dist)|</text>
    <line x1="640" y1="125" x2="660" y2="125" class="edge"/>

    <rect x="664" y="106" width="132" height="38" class="n plain"/>
    <text x="672" y="121" class="h">attribwrangle1</text>
    <text x="672" y="135" class="t">@P.y += f@dist</text>
    <line x1="796" y1="125" x2="816" y2="125" class="edge"/>

    <rect x="820" y="106" width="150" height="38" class="n plain"/>
    <text x="828" y="121" class="h">attribwrangle5 → normal3</text>
    <text x="828" y="135" class="t">二次抬升 pow 1.5</text>
  </g>

  <line x1="590" y1="146" x2="590" y2="164" class="edge"/>
  <rect x="40" y="164" width="1076" height="56" class="n live-dot"/>
  <rect x="52" y="172" width="52" height="15" class="badge"/>
  <text x="58" y="183" class="badge-t">已落地</text>
  <text x="116" y="183" class="h">CSGroundShaperField.h ／ CSGroundShaperField.ush（同一公式的 CPU 孪生与 GPU 权威，逐顶点一致性有断言守着）</text>
  <text x="52" y="204" class="t">h = Top · (S + 0.021·S^1.5)，S = smoothstep(1 − Skirt/Falloff)，再减去 |turb·(1−S)|·Amount；盘内恒 Top、重叠取 max，噪声加在 max 之前。</text>

  <rect x="30" y="236" width="1120" height="26" class="bandhead"/>
  <text x="42" y="254" class="bandtext">链 B　侧面碎石（旧链）</text>
  <text x="200" y="254" class="bandnote">blast10 删 road&gt;0 ⇒ 只长在没路的坡面。⚠️ 下面是 08-31 前的节点：用户已在 Houdini 里重构为 grid2 → voronoifracture1 → … → attribwrangle9，裁决不移植</text>

  <g>
    <rect x="40"  y="272" width="132" height="38" class="n plain"/>
    <text x="48"  y="287" class="h">attribwrangle2</text>
    <text x="48"  y="301" class="t">f@dot = dot(N, +Y)</text>
    <line x1="172" y1="291" x2="192" y2="291" class="edge"/>

    <rect x="196" y="272" width="132" height="38" class="n plain"/>
    <text x="204" y="287" class="h">blast10</text>
    <text x="204" y="301" class="t">删 @road&gt;0</text>
    <line x1="328" y1="291" x2="348" y2="291" class="edge"/>

    <rect x="352" y="272" width="132" height="38" class="n plain"/>
    <text x="360" y="287" class="h">blast1</text>
    <text x="360" y="301" class="t">留 @dot&lt;1（坡面）</text>
    <line x1="484" y1="291" x2="504" y2="291" class="edge"/>

    <rect x="508" y="272" width="132" height="38" class="n plain"/>
    <text x="516" y="287" class="h">scatter1 → fuse1</text>
    <text x="516" y="301" class="t">15 点，tol 0.59 稀释</text>
    <line x1="640" y1="291" x2="660" y2="291" class="edge"/>

    <rect x="664" y="272" width="132" height="38" class="n plain"/>
    <text x="672" y="287" class="h">Findmargin2 → add1</text>
    <text x="672" y="301" class="t">边界等距种子</text>
    <line x1="796" y1="291" x2="816" y2="291" class="edge"/>

    <rect x="820" y="272" width="132" height="38" class="n plain"/>
    <text x="828" y="287" class="h">merge3</text>
    <text x="828" y="301" class="t">内部 + 边界种子</text>
    <line x1="952" y1="291" x2="972" y2="291" class="edge"/>

    <rect x="976" y="272" width="132" height="38" class="n plain"/>
    <text x="984" y="287" class="h">Voronoiscatter1</text>
    <text x="984" y="301" class="t">最近种子分片 + 松边</text>
  </g>

  <polyline points="1108,291 1160,291 1160,320 20,320 20,349 36,349" class="wrap"/>

  <g>
    <rect x="40"  y="330" width="132" height="38" class="n plain"/>
    <text x="48"  y="345" class="h">connectivity1</text>
    <text x="48"  y="359" class="t">i@class 逐块</text>
    <line x1="172" y1="349" x2="192" y2="349" class="edge"/>

    <rect x="196" y="330" width="132" height="38" class="n plain"/>
    <text x="204" y="345" class="h">attribpromote1</text>
    <text x="204" y="359" class="t">v@center 块心</text>
    <line x1="328" y1="349" x2="348" y2="349" class="edge"/>

    <rect x="352" y="330" width="132" height="38" class="n plain"/>
    <text x="360" y="345" class="h">attribwrangle3</text>
    <text x="360" y="359" class="t">外扩 .072 / 内推 .051</text>
    <line x1="484" y1="349" x2="504" y2="349" class="edge"/>

    <rect x="508" y="330" width="132" height="38" class="n plain"/>
    <text x="516" y="345" class="h">polyextrude1</text>
    <text x="516" y="359" class="t">厚 0.12，带 ramp</text>
    <line x1="640" y1="349" x2="660" y2="349" class="edge"/>

    <rect x="664" y="330" width="132" height="38" class="n plain"/>
    <text x="672" y="345" class="h">Findmargin1 分流</text>
    <text x="672" y="359" class="t">边界原样 / 内部 remesh</text>
    <line x1="796" y1="349" x2="816" y2="349" class="edge"/>

    <rect x="820" y="330" width="132" height="38" class="n plain"/>
    <text x="828" y="345" class="h">polyreduce1</text>
    <text x="828" y="359" class="t">减到 56.4%</text>
    <line x1="952" y1="349" x2="972" y2="349" class="edge"/>

    <rect x="976" y="330" width="132" height="38" class="n plain"/>
    <text x="984" y="345" class="h">normal2</text>
    <text x="984" y="359" class="t">cusp 29.9° 硬边</text>
  </g>

  <line x1="305" y1="370" x2="305" y2="388" class="edge"/>
  <line x1="570" y1="427" x2="586" y2="427" class="edge"/>
  <rect x="40" y="388" width="530" height="78" class="n live-dot"/>
  <rect x="52" y="396" width="52" height="15" class="badge"/>
  <text x="58" y="407" class="badge-t">已落地</text>
  <text x="116" y="407" class="h">CPU：ACSGroundActor::RebuildRockShell（碎石归地面）</text>
  <text x="52" y="426" class="t">图案 = TG 原件 rocky_terrain_shell（离线 2D，609 胞腔），抽取时按索引展回三角汤；</text>
  <text x="52" y="440" class="t">BuildMesh 一次性上传 aux 流、包围盒按地面矩形写死；交互期只发 Displace。</text>
  <text x="52" y="454" class="s">「裙圈倾斜」取自用户 08-31 的新链 → RockShellSkirtTilt（唯一移植的一点）。</text>

  <rect x="586" y="388" width="530" height="78" class="n gpu"/>
  <rect x="598" y="396" width="52" height="15" class="badge"/>
  <text x="604" y="407" class="badge-t">已落地</text>
  <text x="662" y="407" class="h">GPU：CSGroundRockShell.usf（一线程一三角）</text>
  <text x="598" y="426" class="t">坡度 mask smoothstep(0.75, 1.25, |∇h|) 替掉 blast1 的坡面筛选，不过阈写 NaN；</text>
  <text x="598" y="440" class="t">每顶点按自身 XY 求解析高度披挂，替掉 Voronoi → 挤出 → 减面；</text>
  <text x="598" y="454" class="t">路不删点（blast10）而是连续下沉，先模糊足迹（RockShellRoadBlurRadius）。</text>

  <rect x="30" y="482" width="1120" height="26" class="bandhead"/>
  <text x="42" y="500" class="bandtext">链 C　石阶</text>
  <text x="170" y="500" class="bandnote">只长在「有路」的坡面上：blast8 只保留 @road&gt;0，与链 B 互补</text>

  <g>
    <rect x="40"  y="518" width="132" height="38" class="n plain"/>
    <text x="48"  y="533" class="h">line1</text>
    <text x="48"  y="547" class="t">竖线，高 = 台高 1.7</text>
    <line x1="172" y1="537" x2="192" y2="537" class="edge"/>

    <rect x="196" y="518" width="132" height="38" class="n plain"/>
    <text x="204" y="533" class="h">attribwrangle6</text>
    <text x="204" y="547" class="t">pscale 底 1 → 顶 .378</text>
    <line x1="328" y1="537" x2="348" y2="537" class="edge"/>

    <rect x="352" y="518" width="132" height="38" class="n plain"/>
    <text x="360" y="533" class="h">resample1</text>
    <text x="360" y="547" class="t">每 0.2 一层</text>
    <line x1="484" y1="537" x2="504" y2="537" class="edge"/>

    <rect x="508" y="518" width="132" height="38" class="n plain"/>
    <text x="516" y="533" class="h">blast7</text>
    <text x="516" y="547" class="t">删最顶一层</text>
    <line x1="640" y1="537" x2="660" y2="537" class="edge"/>

    <rect x="664" y="518" width="132" height="38" class="n plain"/>
    <text x="672" y="533" class="h">transform2</text>
    <text x="672" y="547" class="t">整体下移一层</text>
  </g>

  <polyline points="796,537 1160,537 1160,566 20,566 20,595 36,595" class="wrap"/>

  <g>
    <rect x="40"  y="576" width="132" height="38" class="n plain"/>
    <text x="48"  y="591" class="h">transform1</text>
    <text x="48"  y="605" class="t">基环 R×1.5875</text>
    <line x1="172" y1="595" x2="192" y2="595" class="edge"/>

    <rect x="196" y="576" width="132" height="38" class="n plain"/>
    <text x="204" y="591" class="h">copytopoints2</text>
    <text x="204" y="605" class="t">逐层套环（线性锥）</text>
    <line x1="328" y1="595" x2="348" y2="595" class="edge"/>

    <rect x="352" y="576" width="132" height="38" class="n plain"/>
    <text x="360" y="591" class="h">resample2</text>
    <text x="360" y="605" class="t">环上每 0.278 一点</text>
    <line x1="484" y1="595" x2="504" y2="595" class="edge"/>

    <rect x="508" y="576" width="132" height="38" class="n plain"/>
    <text x="516" y="591" class="h">ray1</text>
    <text x="516" y="605" class="t">投到地面 + 取 road</text>
    <line x1="640" y1="595" x2="660" y2="595" class="edge"/>

    <rect x="664" y="576" width="132" height="38" class="n plain"/>
    <text x="672" y="591" class="h">orientalongcurve1</text>
    <text x="672" y="605" class="t">环切向基</text>
  </g>

  <polyline points="796,595 1160,595 1160,624 20,624 20,653 36,653" class="wrap"/>

  <g>
    <rect x="40"  y="634" width="132" height="38" class="n plain"/>
    <text x="48"  y="649" class="h">attribwrangle7</text>
    <text x="48"  y="663" class="t">Noffset .163 内推</text>
    <line x1="172" y1="653" x2="192" y2="653" class="edge"/>

    <rect x="196" y="634" width="132" height="38" class="n plain"/>
    <text x="204" y="649" class="h">blast8</text>
    <text x="204" y="663" class="t">只留 @road&gt;0</text>
    <line x1="328" y1="653" x2="348" y2="653" class="edge"/>

    <rect x="352" y="634" width="150" height="38" class="n plain"/>
    <text x="360" y="649" class="h">copytopoints1</text>
    <text x="360" y="663" class="t">摆 Step 盒（单一尺寸）</text>
  </g>

  <line x1="305" y1="674" x2="305" y2="692" class="edge"/>
  <line x1="570" y1="729" x2="586" y2="729" class="edge"/>
  <rect x="40" y="692" width="530" height="74" class="n live-dot"/>
  <rect x="52" y="700" width="52" height="15" class="badge"/>
  <text x="58" y="711" class="badge-t">已落地</text>
  <text x="116" y="711" class="h">CPU：ACSGroundActor::RebuildStairs（石阶归地面）</text>
  <text x="52" y="730" class="t">只递交扫描矩形、格距 StairCellSize（≈ 石阶长）、层高与阈值；</text>
  <text x="52" y="744" class="t">EnsureBuffers 定容、交互期零阻塞；CPU 不知道有几级，零回读。</text>
  <text x="52" y="758" class="s">包围盒按地面矩形 × MaxAbsHeight 写死（只有 GPU 知道摆了哪些）。</text>

  <rect x="586" y="692" width="530" height="74" class="n gpu"/>
  <rect x="598" y="700" width="52" height="15" class="badge"/>
  <text x="604" y="711" class="badge-t">已落地</text>
  <text x="662" y="711" class="h">GPU：CSGroundStairs.usf（ScanGroundStairsCS，一线程一格）</text>
  <text x="598" y="730" class="t">marching squares 逐格逐层解等值线段，替掉「线性锥 + ray1 投影」；</text>
  <text x="598" y="744" class="t">格心路权 ≥ StairRoadThreshold 替掉 blast8；每段出一级：单一 StairMesh</text>
  <text x="598" y="758" class="t">+ 格身份哈希抖动，替掉 copytopoints1 的单一 Step 盒；InterlockedAdd 直写实例行。</text>

  <rect x="40" y="776" width="1076" height="26" class="n legacy"/>
  <rect x="52" y="782" width="52" height="15" class="badge"/>
  <text x="58" y="793" class="badge-t">已删除</text>
  <text x="116" y="793" class="t">2026-08-30 裁决一（S3）删掉旧路：CPU BuildStepPlan（闭式环半径 + 弧段 + SolveBlockLayout 铺装）→ RDG_SmoothSpline → CSGroundSteps.usf。</text>
  <text x="1104" y="793" class="s" text-anchor="end">RDG_SmoothSpline / SolveBlockLayout 本体另有消费者，保留</text>

  <rect x="30" y="816" width="1120" height="38" class="n plain"/>
  <rect x="46"  y="827" width="26" height="16" class="n plain"/>
  <text x="80"  y="840" class="s">Houdini 原型节点</text>
  <rect x="200" y="827" width="26" height="16" class="n live-dot"/>
  <text x="234" y="840" class="s">UE 已落地</text>
  <rect x="330" y="827" width="26" height="16" class="n gpu"/>
  <text x="364" y="840" class="s">GPU pass</text>
  <rect x="450" y="827" width="26" height="16" class="n legacy"/>
  <text x="484" y="840" class="s">已删除的旧路（留档）</text>
  <line x1="620" y1="835" x2="652" y2="835" class="wrap"/>
  <text x="662" y="840" class="s">链在此换行续接</text>
  <text x="780" y="840" class="s">Houdini 值为场景单位；UE 默认值见两个 actor 头文件的声明注释</text>
</svg>
