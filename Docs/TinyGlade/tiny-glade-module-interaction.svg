<svg viewBox="0 0 1650 850" width="1650" height="850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <pattern id="pickable-domain-cross-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#e0e7ff"/>
      <path d="M0 6H12" stroke="#4f46e5" stroke-width="1" opacity="0.316770"/>
      <path d="M6 0V12" stroke="#4f46e5" stroke-width="1" opacity="0.316770"/>
    </pattern>
    <pattern id="csmesh-resident-cross-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#f3e8ff"/>
      <path d="M0 6H12" stroke="#7c3aed" stroke-width="1" opacity="0.293103"/>
      <path d="M6 0V12" stroke="#7c3aed" stroke-width="1" opacity="0.293103"/>
    </pattern>
    <pattern id="buffer-owner-stripe-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#e2e8f0"/>
      <rect y="1" width="10" height="2" fill="#334155" opacity="0.291429"/>
      <rect y="6" width="10" height="1.5" fill="#334155" opacity="0.291429"/>
    </pattern>
    <pattern id="legacy-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <rect x="0" y="0" width="10" height="2" fill="#64748b" opacity="0.361702"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ea580c"/>
    </marker>
  </defs>
  <style>
    .box      { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.2; }
    .ext      { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:6 4; }
    .core     { fill:url(#pickable-domain-cross-bg); stroke:#4f46e5; stroke-width:1.4; }
    .resident { fill:url(#csmesh-resident-cross-bg); stroke:#7c3aed; stroke-width:1.4; }
    .owner    { fill:url(#buffer-owner-stripe-bg); stroke:#334155; stroke-width:1.2; }
    .legacy-hatch { fill:url(#legacy-hatch); stroke:#64748b; stroke-width:1.2; }
    .t  { font-size:13px; font-weight:600; fill:#0f172a; }
    .t2 { font-size:12px; font-weight:600; fill:#0f172a; }
    .b  { font-size:10px; fill:#334155; }
    .m  { font-size:10px; fill:#64748b; }
    .n  { font-size:10px; fill:#334155; }
    .nd { font-size:10px; fill:#1d4ed8; }
    .ns { font-size:10px; fill:#c2410c; }
    .w  { stroke:#334155; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .d  { stroke:#2563eb; stroke-width:1.6; fill:none; marker-end:url(#arrow-d); }
    .s  { stroke:#ea580c; stroke-width:1.4; fill:none; stroke-dasharray:5 3; marker-end:url(#arrow-s); }
  </style>

  <text x="20" y="36" font-size="20" font-weight="700" fill="#0f172a">TinyGlade 复刻：模块交互图（谁包含谁、谁调谁、谁通知谁）</text>
  <text x="20" y="58" class="m" font-size="12px">读法：箭头指向被调方 / 被通知方；每个框里列的是本审查核实到的交互相关状态；圈码 ⑧–⑲ = TinyGlade_结构审查.md 深挖 D / E 的小节号；按 2026-09-11 代码更新</text>

  <line x1="20" y1="84" x2="60" y2="84" class="w"/>
  <text x="66" y="88" class="n">同步直接调用</text>
  <line x1="160" y1="84" x2="200" y2="84" class="d"/>
  <text x="206" y="88" class="nd">静态 / 多播委托广播</text>
  <line x1="340" y1="84" x2="380" y2="84" class="s"/>
  <text x="386" y="88" class="ns">TActorIterator 世界扫描取首个</text>
  <rect x="560" y="76" width="26" height="16" rx="3" class="core"/>
  <text x="592" y="88" class="n">核心 actor（房子）</text>
  <rect x="710" y="76" width="26" height="16" rx="3" class="resident"/>
  <text x="742" y="88" class="n">地面（CPU 权威镜像）</text>
  <rect x="880" y="76" width="26" height="16" rx="3" class="owner"/>
  <text x="912" y="88" class="n">注册表</text>
  <rect x="980" y="76" width="26" height="16" rx="3" class="legacy-hatch"/>
  <text x="1012" y="88" class="n">遗留代码</text>
  <rect x="1090" y="76" width="26" height="16" rx="3" class="ext"/>
  <text x="1122" y="88" class="n">编辑器模块 / 头文件说明</text>
  <rect x="1290" y="76" width="26" height="16" rx="3" class="box"/>
  <text x="1322" y="88" class="n">从属 actor</text>

  <!-- 行 1 -->
  <rect x="20" y="110" width="240" height="170" rx="8" class="owner"/>
  <text x="28" y="130" class="t">UCSHouseSubsystem</text>
  <text x="28" y="146" class="m">花名册 + 0.25 s 兜底快扫（编辑器 world 也 tick）</text>
  <text x="28" y="164" class="b">Tracked: TMap&lt;FGuid, {House, Hash}&gt;</text>
  <text x="28" y="178" class="b">Tick：逐栋 GetTrackingHash ≠ 基线</text>
  <text x="28" y="192" class="m">→ ReevaluateSite（同步；延后入口之一）</text>
  <text x="28" y="208" class="b">PickHouse / PickHouseNear → 房子解析求交</text>
  <text x="28" y="222" class="b">PlaceMarkerAlongRay：生成 + AdoptAnchor</text>
  <text x="28" y="240" class="m">⑬ 键 = HouseId，复制房子撞键 → 只剩一栋在册</text>
  <text x="28" y="254" class="m">⑨ MarkHouseDirty 合并队列只有抓手在用</text>
  <text x="28" y="268" class="m">花名册按 GUID 升序（接缝邻居 / PickHouse）</text>

  <rect x="420" y="110" width="300" height="170" rx="8" class="ext"/>
  <text x="428" y="130" class="t">PCGEditorProcess（编辑器模块）</text>
  <text x="428" y="148" class="b">FCSWindowBrushEdMode（窗笔刷）</text>
  <text x="428" y="162" class="b">FCSGroundPaintEdMode（地面画笔）</text>
  <text x="428" y="176" class="b">CSHouseResizeSelectionWatcher（失选即退出）</text>
  <text x="428" y="196" class="m">只订阅三个静态委托；运行时模块零编辑器 include ✔</text>
  <text x="428" y="210" class="m">CSWindowBrushEdModeTests 钉住「按钮 → 委托 → 激活」链 ✔</text>
  <text x="428" y="230" class="b">→ 子系统 PlaceMarkerAlongRay（落笔）</text>
  <text x="428" y="244" class="b">→ 地面 ApplyPaintStroke / Begin/EndPaintStroke</text>
  <text x="428" y="262" class="m">包含 CSHouseActor.h 的 14 个文件里 5 个在这里 ⑧</text>

  <rect x="1380" y="110" width="250" height="185" rx="8" class="ext"/>
  <text x="1388" y="130" class="t">⑧ 挂错名下的公共头</text>
  <text x="1388" y="150" class="b">CSGroundShaperSteps.h</text>
  <text x="1388" y="164" class="m">= GPU palette 基座；6 个房子头 include</text>
  <text x="1388" y="178" class="m">还为一个宏带上整个实例组件头</text>
  <text x="1388" y="196" class="b">CSHouseVine.h</text>
  <text x="1388" y="210" class="m">= FWallStrip / Hash01 / IdentityHash /</text>
  <text x="1388" y="224" class="m">BuildBaseMesh，瓦·柱·摆件·地面都用</text>
  <text x="1388" y="242" class="b">CSHouseDecor.h ← CSGroundDecor.h</text>
  <text x="1388" y="256" class="m">地面复用房子的规划 / 打包</text>
  <text x="1388" y="272" class="b">CSHouseFeatureMarker.h → CSHouseActor.h</text>
  <text x="1388" y="286" class="m">只为 FCSHouseWindow 一个 struct</text>

  <!-- 行 2 -->
  <rect x="20" y="340" width="240" height="270" rx="8" class="box"/>
  <text x="28" y="360" class="t">ACSHouseFeatureMarker ×N</text>
  <text x="28" y="378" class="b">ACSWindowMarker（Blueprintable 子类）</text>
  <text x="28" y="398" class="b">Anchor：权威，序列化，进事务</text>
  <text x="28" y="412" class="m">Host：transient 弱引用</text>
  <text x="28" y="426" class="m">+ attach 父 = 第三份宿主关系 ⑫</text>
  <text x="28" y="446" class="b">Tick（拖动期）→ HandleDrag(false)</text>
  <text x="28" y="460" class="m">→ RegisterAnchor → 房子只标脏、合批 ⑨</text>
  <text x="28" y="480" class="b">RegisterAnchor：</text>
  <text x="28" y="494" class="m">探针裁决 → 登记（只标脏）→ 回写探针 ⑪</text>
  <text x="28" y="508" class="m">（最终裁决合批后才到；记账仍按探针）</text>
  <text x="28" y="528" class="b">MarkerId：构造期 NewGuid</text>
  <text x="28" y="542" class="m">复制 actor 不重掷 ⑬</text>
  <text x="28" y="562" class="m">读 Host->FootprintSize / WallThickness</text>
  <text x="28" y="576" class="m">PostEditMove / Undo / 改属性 各自触发解析</text>
  <text x="28" y="592" class="m">无宿主自毁只在最终裁决（基类纪律 ④ ✔）</text>

  <rect x="420" y="340" width="300" height="270" rx="8" class="core"/>
  <text x="428" y="360" class="t">ACSHouseActor（4247 + 2538 行）</text>
  <text x="428" y="378" class="b">ReevaluateSite()：同步 7 处 + 自 Tick 合批 + 子系统 ⑨</text>
  <text x="428" y="392" class="m">只标脏：地面广播 / 标记登记；同步：抓手推拉 /</text>
  <text x="428" y="406" class="m">构造脚本 / PostRegister / Move / Undo / Rebuild</text>
  <text x="428" y="426" class="b">MarkerWindows：{Id, Window, Anchor 副本, Marker}</text>
  <text x="428" y="440" class="m">锚点存两份、宿主关系三份 ⑫</text>
  <text x="428" y="460" class="b">ResizeHandles：4 锥 + 1 框，RF_Transient</text>
  <text x="428" y="480" class="b">Ground：TActorIterator 取首个 + AddUObject</text>
  <text x="428" y="500" class="b">FootprintSize / WallThickness / WallHeight 裸字段</text>
  <text x="428" y="514" class="m">被标记 / 抓手 / 子系统直接读 13 次 ⑧</text>
  <text x="428" y="534" class="b">GetTrackingHash：自身摆位 + 接缝邻居摆位</text>
  <text x="428" y="554" class="b">CSVineTube::BuildTubeIntoMesh → 遗留文件 ⑲</text>
  <text x="428" y="574" class="m">约 60 个只读探针 UFUNCTION vs 约 20 个真 API ⑱</text>
  <text x="428" y="592" class="m">HouseId：UPROPERTY()，复制 actor 不重掷 ⑬</text>

  <rect x="920" y="340" width="300" height="270" rx="8" class="resident"/>
  <text x="928" y="360" class="t">ACSGroundActor（2321 + 1745 行）</text>
  <text x="928" y="378" class="b">Mirror.Heights / Colors：CPU 权威镜像</text>
  <text x="928" y="398" class="b">Shapers：世界扫描 + 登记两路写同一张表 ⑩</text>
  <text x="928" y="412" class="m">顺序不随关卡保存（CSGroundDecor.h 自述）</text>
  <text x="928" y="432" class="b">RegisterShaper → 全域刷新 + RebuildSkirtDecor</text>
  <text x="928" y="446" class="m">一次登记 = 2 次高度刷新 + 9 次派生重建 ⑩</text>
  <text x="928" y="466" class="b">RefreshHeightsInRegion：镜像没变也跑 4 条派生链</text>
  <text x="928" y="486" class="b">OnGroundChanged 广播：每 dab / 每帧拖地面 /</text>
  <text x="928" y="500" class="m">每次区域刷新 / RebuildGroundMesh（全盒）</text>
  <text x="928" y="520" class="b">SampleHeight / SampleRoadWeight / RaycastGround</text>
  <text x="928" y="540" class="b">RebuildStairs 无哈希守卫：每次都 dispatch</text>
  <text x="928" y="560" class="m">派生四链：石阶 / 岩壳 / 裙边摆件 / 地被，</text>
  <text x="928" y="574" class="m">各持 buffer、各自 Release（大问题 1）</text>
  <text x="928" y="592" class="m">ChangedBounds 无任何消费者（大问题 2）</text>

  <rect x="1380" y="340" width="250" height="200" rx="8" class="box"/>
  <text x="1388" y="360" class="t">ACSGroundShaperActor ×N</text>
  <text x="1388" y="378" class="b">ACSTinyGlade 子类：只借基类 OnConstruction ⑲</text>
  <text x="1388" y="398" class="b">RebuildTerrain 触发点 ×4：</text>
  <text x="1388" y="412" class="m">OnConstruction / PostRegister /</text>
  <text x="1388" y="426" class="m">PostEditChangeProperty / PostEditMove</text>
  <text x="1388" y="446" class="b">SampleShapeHeight：解析场的 CPU 孪生</text>
  <text x="1388" y="460" class="m">（与 .ush 有 CpuGpuFieldParity 守着 ✔）</text>
  <text x="1388" y="480" class="b">只与地面对话，不订阅 OnGroundChanged ✔</text>
  <text x="1388" y="500" class="m">Ground：TActorIterator 取首个</text>
  <text x="1388" y="520" class="m">加载顺序决定谁先登记 → 最坏 O(N²) 刷新 ⑩</text>

  <!-- 行 3 -->
  <rect x="420" y="660" width="300" height="160" rx="8" class="box"/>
  <text x="428" y="680" class="t2">ResizeHandle ×4 + HeightHandle ×1（抓手族）</text>
  <text x="428" y="698" class="b">RF_Transient，attach 在房子下（父级带动回路）</text>
  <text x="428" y="716" class="b">OnHandleDrag → PushEdge / PushHeight</text>
  <text x="428" y="730" class="m">= 立即 ReevaluateSite + MarkHouseDirty 再来一次</text>
  <text x="428" y="750" class="b">记账量 LastConsumedWorld / LastAppliedOffset</text>
  <text x="428" y="764" class="m">两族各一份，正文七成逐字相同 ⑯</text>
  <text x="428" y="784" class="m">每次事件 SnapResizeHandles → 5 个 SetActorLocation</text>
  <text x="428" y="800" class="m">基类 ACSHouseHandleActor：宿主纪律 / 双解绑 / 降级 ✔</text>

  <rect x="920" y="660" width="300" height="160" rx="8" class="legacy-hatch"/>
  <text x="928" y="680" class="t">遗留藤蔓：GeometryEditorActor.cpp 4863 行</text>
  <text x="928" y="698" class="b">AVineContainer（空间殖民 / 体素吸附）</text>
  <text x="928" y="716" class="b">CSVineTube::BuildTubeIntoMesh 实现在此 ⑲</text>
  <text x="928" y="730" class="m">用两个 file-static，所以搬不出去</text>
  <text x="928" y="750" class="b">CSVineScatter.cpp（519 行）</text>
  <text x="928" y="764" class="m">TActorIterator&lt;ACSGroundActor&gt; 反向依赖 TG</text>
  <text x="928" y="784" class="m">TG 实际只用约 100 行入口；其余 5.3K 行</text>
  <text x="928" y="800" class="m">无 TG 消费者（待拍板：删或留）</text>

  <!-- 边：编辑器 ↔ 子系统 / 房子 / 地面 -->
  <path d="M420 150 H262" class="w"/>
  <text x="268" y="144" class="n">PlaceMarkerAlongRay</text>
  <text x="268" y="164" class="n">← 窗笔刷落笔（EdMode）</text>
  <path d="M480 340 V282" class="d"/>
  <text x="488" y="300" class="nd">OnWindowBrushRequest /</text>
  <text x="488" y="314" class="nd">OnResizeModeChanged 静态委托</text>
  <path d="M980 340 V318 H740 V200 H722" class="d"/>
  <text x="750" y="312" class="nd">OnGroundPaintEditorRequest 静态委托</text>

  <!-- 边：子系统 ↔ 房子 -->
  <path d="M260 230 H405 V360 H418" class="w"/>
  <text x="268" y="224" class="n">快扫 → Reevaluate · PickHouse</text>
  <path d="M420 400 H385 V262 H262" class="w"/>
  <text x="268" y="256" class="n">Register · MarkDirty</text>
  <text x="268" y="278" class="n">花名册（接缝邻居）</text>

  <!-- 边：子系统 ↔ 标记 -->
  <path d="M60 340 V282" class="w"/>
  <text x="68" y="300" class="n">PickHouse(Near)</text>
  <text x="68" y="314" class="n">拖动期每 tick</text>
  <path d="M210 280 V338" class="w"/>
  <text x="218" y="300" class="n">生成 +</text>
  <text x="218" y="314" class="n">AdoptAnchor</text>

  <!-- 边：标记 ↔ 房子 -->
  <path d="M260 470 H418" class="w"/>
  <text x="268" y="450" class="n">探针裁决 QueryFeatureReject</text>
  <text x="268" y="464" class="n">→ RegisterFeatureMarker ⑪</text>
  <text x="268" y="486" class="n">→ RequestReevaluate（合批）</text>
  <text x="268" y="500" class="n">拖动期每帧一次，N 个合一 ⑨</text>
  <path d="M420 550 H262" class="w"/>
  <text x="268" y="530" class="n">NotifyMarkersRebuilt 每轮末</text>
  <text x="268" y="544" class="n">ApplyHostVerdict 回执</text>
  <text x="268" y="566" class="n">SnapToAnchor · Reanchor</text>
  <text x="268" y="580" class="n">锚点副本回写 ⑫</text>

  <!-- 边：房子 ↔ 地面 -->
  <path d="M920 385 H722" class="d"/>
  <text x="728" y="367" class="nd">OnGroundChanged 广播</text>
  <text x="728" y="399" class="nd">→ RequestReevaluate（只标脏）⑨</text>
  <text x="728" y="413" class="nd">每帧每栋至多一次（09-10 起）</text>
  <path d="M720 455 H918" class="w"/>
  <text x="728" y="437" class="n">SampleHeight / SampleRoadWeight</text>
  <text x="728" y="469" class="n">落座 ≈220 + 门 ≈340 次 / 轮</text>
  <path d="M720 520 H918" class="s"/>
  <text x="728" y="512" class="ns">TActorIterator 取首个地面</text>
  <text x="728" y="534" class="ns">+ OnGroundChanged.AddUObject</text>

  <!-- 边：地面 ↔ 塑形物 -->
  <path d="M1380 385 H1222" class="w"/>
  <text x="1228" y="367" class="n">RegisterShaper ⑩</text>
  <text x="1228" y="379" class="n">RefreshHeightsInRegion</text>
  <path d="M1220 430 H1378" class="s"/>
  <text x="1228" y="424" class="ns">ResolveShapers 世界扫描</text>
  <path d="M1220 480 H1378" class="w"/>
  <text x="1228" y="474" class="n">SampleShapeHeight</text>
  <text x="1228" y="494" class="n">×4225 格 ×N 座 / 全域刷新</text>
  <path d="M1380 525 H1222" class="s"/>
  <text x="1228" y="540" class="ns">TActorIterator 取首个地面</text>

  <!-- 边：房子 ↔ 抓手 -->
  <path d="M470 610 V658" class="w"/>
  <text x="478" y="626" class="n">EnterResizeMode: Spawn+Attach+Init</text>
  <text x="478" y="640" class="n">每次事件 SnapResizeHandles ×5</text>
  <path d="M700 660 V612" class="w"/>
  <text x="708" y="626" class="n">PushEdge / PushHeight</text>
  <text x="708" y="640" class="n">立即重求值 + MarkDirty 延后再一次 ⑨</text>

  <!-- 边：房子 → 遗留藤蔓；遗留 → 地面 -->
  <path d="M720 590 H905 V700 H918" class="w"/>
  <text x="728" y="570" class="n">CSVineTube::BuildTubeIntoMesh</text>
  <text x="728" y="584" class="n">→ 焊在旧藤蔓文件末尾 ⑲</text>
  <path d="M1000 660 V612" class="s"/>
  <text x="1008" y="636" class="ns">CSVineScatter.cpp → TActorIterator 取首个</text>
</svg>
