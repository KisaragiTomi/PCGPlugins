  <rect x="20" y="566" width="1610" height="116" rx="8" class="box"/>
  <text x="34" y="588" class="t">顺序约束：只写在注释里，颠倒不报错、只出错画面</text>
  <text x="34" y="608" class="n">② 必须在 ③ 前：两者互不读，排在前面只为进同一份 BodyShapeHash（ReevaluateSite 注释原话「接缝裁剪必须排在门之前只有一个理由」）。</text>
  <text x="34" y="624" class="n">③ 必须在 ④⑥⑦⑨⑩⑪ 前：它们都读 CurrentOpenings；ResolvePierSpans 又必须在窗过完谓词之后、形状哈希之前，晚一步 = 墩位翻了房体不重建。</text>
  <text x="34" y="640" class="n">⑥ 内部六家 Build*Bricks 的顺序决定砖的槽位 ⇒ 决定门框砖的逐实例随机数（换序 = 整墙砖变色）；接缝砖不读 ②，而是再调一次 GatherSeamNeighbours 重算。</text>
  <text x="34" y="656" class="n">⑪ 必须最后：读 ③ 写好的 CurrentFeatureVerdicts。SnapToAnchor 不发 PostEditMove、不会重入；09-10 起标记登记也只 RequestReevaluate（置脏，下一 tick 合批）。</text>
  <text x="34" y="672" class="n">图中未单列：① 与 ② 之间还有 ReanchorMarkersToPreserveWorld（写 MarkerWindows[].Anchor、标记 Anchor 与 MarkerRef*）；④⑤ 的 Pending / BuiltAt / 两级哈希已并进基类 FCSMeshSlotState。</text>
