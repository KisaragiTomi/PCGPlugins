<svg viewBox="0 0 1360 790" width="1360" height="790" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <pattern id="pickable-domain-cross-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#e0e7ff"/>
      <path d="M0 6H12" stroke="#4f46e5" stroke-width="1" opacity="0.316770"/>
      <path d="M6 0V12" stroke="#4f46e5" stroke-width="1" opacity="0.316770"/>
    </pattern>
    <pattern id="sv-stripe-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <pattern id="retained-stripe-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.2; }
    .future{ fill:#f8fafc; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:6 4; }
    .core  { fill:url(#pickable-domain-cross-bg); stroke:#4f46e5; stroke-width:1.6; }
    .sv-stripe { fill:url(#sv-stripe-bg); stroke:#0284c7; stroke-width:1.2; }
    .retained-stripe { fill:url(#retained-stripe-bg); stroke:#d97706; stroke-width:1.1; }
    .t  { font-size:13.5px; font-weight:600; fill:#0f172a; }
    .b  { font-size:12px; fill:#334155; }
    .m  { font-size:12px; fill:#64748b; }
    .h  { font-size:12.5px; font-weight:600; fill:#64748b; }
    .s  { font-size:11px; fill:#64748b; }
    .flow  { stroke:#475569; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    .flowd { stroke:#94a3b8; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#arrow-dash); }
  </style>

  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">CSSceneDirty3D：场景级三维 Dirty 区域系统</text>
  <text x="30" y="60" class="m">源头只有体素：MarkDirtyVoxels——mesh 变化也在发布侧体素化 · 设计稿（未实现）</text>

  <text x="30"  y="88" class="h">发布侧（一切先体素化）</text>
  <text x="470" y="88" class="h">中枢</text>
  <text x="910" y="88" class="h">消费侧（局部更新）</text>

  <!-- ================= 发布侧 ================= -->
  <rect x="30" y="100" width="360" height="110" rx="8" class="box"/>
  <text x="44" y="120" class="t">P1 引擎 merge 重渲染区域</text>
  <text x="44" y="140" class="b">ACSLandscape::RenderLayer（钩子已存在）</text>
  <text x="44" y="157" class="b">SectionRect → XY 体素列 × 组件 Z 界</text>
  <text x="44" y="174" class="b">整列保守全标 → MarkDirtyVoxels</text>
  <text x="44" y="191" class="m">Road 写层引发的 merge 也走这里（晚 1~2 帧）</text>

  <rect x="30" y="228" width="360" height="112" rx="8" class="box"/>
  <text x="44" y="248" class="t">P2 CS 产出回灌（新增）</text>
  <text x="44" y="268" class="b">Road 写 EditLayer · CSSW bake · Vine Save Mesh</text>
  <text x="44" y="285" class="b">产出 bounds → MarkDirtyBox 保守体素化</text>
  <text x="44" y="302" class="b">随后登记 Self-Mask（防自触发）</text>
  <text x="44" y="319" class="m">接入成本：每处一行发布 + 一行掩码</text>

  <rect x="30" y="358" width="360" height="72" rx="8" class="box"/>
  <text x="44" y="378" class="t">P3 手动 API</text>
  <text x="44" y="398" class="b">MarkDirtyVoxels / MarkDirtyBox（保守封装）</text>
  <text x="44" y="415" class="m">BlueprintCallable + Python 可调</text>

  <rect x="30" y="448" width="360" height="110" rx="8" class="future"/>
  <text x="44" y="468" class="t">P4 编辑器通用监听（M5 · 待核对）</text>
  <text x="44" y="488" class="b">OnLevelActorAdded / Deleted</text>
  <text x="44" y="505" class="b">OnObjectPropertyChanged · actor 移动委托</text>
  <text x="44" y="522" class="b">mesh 增删移 → MarkDirtyMesh（旧+新各一次）</text>
  <text x="44" y="539" class="m">委托清单落地时核对</text>

  <rect x="30" y="576" width="360" height="100" rx="8" class="future"/>
  <text x="44" y="596" class="t">mesh → 体素转换器（M5 AABB / M6 精确）</text>
  <text x="44" y="616" class="b">≤ 512 体素：AABB 全标（同步）</text>
  <text x="44" y="633" class="b">大 mesh：GPU 表面体素化 → 回读晚 1~2 帧补标</text>
  <text x="44" y="650" class="b">复用 TriangleAABBOverlapsVoxel 判定</text>
  <text x="44" y="667" class="m">铁律：只许过标，不许漏标</text>

  <!-- ================= 中枢 ================= -->
  <rect x="470" y="100" width="380" height="248" rx="8" class="core"/>
  <text x="486" y="122" class="t">UCSSceneDirtySubsystem</text>
  <text x="486" y="140" class="m">UTickableWorldSubsystem · per-world</text>
  <rect x="486" y="150" width="348" height="104" rx="6" class="sv-stripe"/>
  <text x="498" y="168" class="t" font-size="12.5px">帧内 Pending TMap&lt;Tile, uint64&gt;（位或合并）</text>
  <text x="498" y="186" class="b">一条标记 = (TileKey, VoxelMask64) = 64 体素</text>
  <text x="498" y="203" class="b">每帧 flush → 批次 (Marks[], Generation) 入环</text>
  <text x="498" y="220" class="b">环容量 65536 条 ≈ 1.25 MB</text>
  <text x="498" y="237" class="m">超 MaxMarksPerFlush → 整环置溢出（全员全量）</text>
  <text x="486" y="276" class="b">PullEvents(LastGen) → 批次 + bEventsLost</text>
  <text x="486" y="294" class="b">游标由消费者自持（重开图 = 0 → 首次全量）</text>
  <text x="486" y="312" class="b">csd.VoxelSize = 100 全局体素，tile = 4×4×4 体素</text>
  <text x="486" y="330" class="m">voxel key = FloorToInt(World / 100)，WP 无界可用</text>

  <rect x="470" y="364" width="380" height="124" rx="8" class="box"/>
  <text x="486" y="384" class="t">防自环与退化</text>
  <text x="486" y="404" class="b">入口无来源 → 写场景的消费者自配 Self-Mask</text>
  <text x="486" y="421" class="b">Self-Mask = tile+VoxelMask + 帧 TTL（默认 5）</text>
  <text x="486" y="438" class="b">环溢出 → bEventsLost → 全量重建</text>
  <text x="486" y="455" class="b">覆盖 &gt; 60% → 升级整幅捕获</text>
  <text x="486" y="472" class="m">csd.ForceFullRebuild 1 → 一键回全量对照</text>

  <rect x="470" y="508" width="380" height="28" rx="14" fill="#f1f5f9" stroke="#64748b"/>
  <text x="660" y="526" text-anchor="middle" font-size="10.5" fill="#334155">入口只有体素：MarkDirtyVoxels · Box/Mesh 封装先体素化再入环</text>

  <!-- ================= 消费侧 ================= -->
  <rect x="910" y="100" width="420" height="136" rx="8" class="box"/>
  <text x="924" y="120" class="t">CSSW：CaptureRegion（M1）</text>
  <text x="924" y="140" class="b">命中体素并盒 → Z 裁剪 ∩ [ActorZ ± MaxHeight]</text>
  <text x="924" y="157" class="b">子矩形对齐 texel 网格 + 清哨兵（体素≈2.5 texel）</text>
  <text x="924" y="174" class="b">无来源预筛：区域内重捕获即正确（幂等）</text>
  <text x="924" y="191" class="b">RenderHeightmap(FBox2D 子区域) · 覆盖&gt;60% 全幅</text>
  <rect x="924" y="202" width="196" height="22" rx="5" class="retained-stripe"/>
  <text x="934" y="217" font-size="11" fill="#92400e">RT_SceneDepth 只重写子矩形</text>

  <rect x="910" y="256" width="420" height="140" rx="8" class="box"/>
  <text x="924" y="276" class="t">藤蔓 AVineContainer（M2 / M4）</text>
  <text x="924" y="296" class="b">V1：命中体素 ∩ bounds → 自动全量重跑</text>
  <text x="924" y="313" class="b">V2：cell 级收集缓存，体素 ↔ cell 1:1 直映</text>
  <text x="924" y="330" class="b">前置：ContentDirtyCells 与激活 diff 分离</text>
  <text x="924" y="347" class="b">红线：SC pass 图不动；验证开 r.RDG.ImmediateMode 1</text>
  <rect x="924" y="358" width="230" height="22" rx="5" class="retained-stripe"/>
  <text x="934" y="373" font-size="11" fill="#92400e">三角缓存 RT（4096 页 × 256 三角）</text>

  <rect x="910" y="416" width="420" height="108" rx="8" class="box"/>
  <text x="924" y="436" class="t">道路 ACSLandscapeRoad（M3）</text>
  <text x="924" y="456" class="b">样条编辑走自身 OnConstruction，不经本系统</text>
  <text x="924" y="473" class="b">外部体素 → 只重贴地 + 窗口化扩散（跳过 7 kernel）</text>
  <text x="924" y="490" class="b">bake 写层配 Self-Mask（merge 晚 1~2 帧发布）</text>
  <text x="924" y="507" class="m">无法分辨来源：头顶 mesh 也触发重贴地（幂等，接受）</text>

  <rect x="910" y="540" width="420" height="108" rx="8" class="future"/>
  <text x="924" y="560" class="t">未来消费者 / 生产者</text>
  <text x="924" y="580" class="b">楼房·桌子：MarkDirtyMesh 一行接入 + 按层 Z 消费</text>
  <text x="924" y="597" class="b">水体：每体一个 CSSW 实例，按各自 bounds 订阅</text>
  <text x="924" y="614" class="b">ACSShallowWaterVoxelCapture：体素 → CSR 列游程</text>
  <text x="924" y="631" class="m">原生三维消费者，可与全局体素同格（Build 目前空桩）</text>

  <!-- ================= 数据流 ================= -->
  <text x="430" y="132" text-anchor="middle" class="s">MarkDirty*</text>
  <line x1="390" y1="155" x2="468" y2="165" class="flow"/>
  <line x1="390" y1="284" x2="468" y2="215" class="flow"/>
  <line x1="390" y1="393" x2="468" y2="260" class="flow"/>
  <line x1="390" y1="500" x2="468" y2="305" class="flowd"/>
  <line x1="390" y1="622" x2="468" y2="338" class="flowd"/>

  <text x="880" y="132" text-anchor="middle" class="s" font-size="10">Pull(LastGen)</text>
  <line x1="850" y1="170" x2="908" y2="168" class="flow"/>
  <line x1="850" y1="215" x2="908" y2="326" class="flow"/>
  <line x1="850" y1="260" x2="908" y2="468" class="flow"/>
  <line x1="850" y1="300" x2="908" y2="592" class="flowd"/>

  <path d="M1330 472 H1348 V700 H14 V284 H28" class="flowd"/>
  <text x="690" y="692" text-anchor="middle" class="s">产出回灌：写 EditLayer → 引擎 merge → P1 标体素列 · bake 落盘 → P2；Self-Mask 防自触发</text>

  <!-- ================= 图例 ================= -->
  <rect x="30"  y="726" width="26" height="18" rx="4" class="core"/>
  <text x="64"  y="740" class="s">中枢核心（UWorldSubsystem）</text>
  <rect x="240" y="726" width="26" height="18" rx="4" class="sv-stripe"/>
  <text x="274" y="740" class="s">体素标记 / 状态</text>
  <rect x="380" y="726" width="26" height="18" rx="4" class="retained-stripe"/>
  <text x="414" y="740" class="s">Actor 常驻 GPU 缓存</text>
  <rect x="570" y="726" width="26" height="18" rx="4" class="future"/>
  <text x="604" y="740" class="s">未实现 / 待核对</text>
  <line x1="750" y1="735" x2="792" y2="735" class="flow"/>
  <text x="800" y="740" class="s">MarkDirty / Pull 数据流</text>
  <line x1="960" y1="735" x2="1002" y2="735" class="flowd"/>
  <text x="1010" y="740" class="s">产出回灌级联 · 未实现路径</text>
</svg>
